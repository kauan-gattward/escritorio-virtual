<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1e5c55" />
  <meta name="description" content="Escritório virtual privado do Kauan." />
  <title>O Escritório</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <main id="lock">
    <form class="lock-card" id="lock-form" autocomplete="off">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 42 42" width="42" height="42">
          <path d="M21 4 L36 13 L21 22 L6 13 Z" fill="#1e5c55"/>
          <path d="M8 16 L21 24 L21 36 L8 28 Z" fill="#d25a32"/>
          <path d="M34 16 L21 24 L21 36 L34 28 Z" fill="#143e3b"/>
        </svg>
      </div>
      <h1>O Escritório</h1>
      <p class="lede">A mesma senha abre no celular e no computador.</p>
      <canvas id="lock-preview" width="240" height="240" aria-hidden="true"></canvas>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" minlength="8" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required />
      <p id="lock-error" role="alert"></p>
      <button class="primary" id="enter" type="submit">Entrar</button>
      <p class="hint">Oito caracteres ou mais. Ela deriva a chave que abre tarefas e resultados, em qualquer aparelho.</p>
    </form>
  </main>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <path d="M16 3 L29 11 L16 19 L3 11 Z" fill="#f4efe4"/>
          <path d="M5 13 L16 20 L16 29 L5 22 Z" fill="#d25a32"/>
          <path d="M27 13 L16 20 L16 29 L27 22 Z" fill="#1e5c55"/>
        </svg>
        <span>O Escritório</span>
      </div>
      <strong id="room-label">Recepção</strong>
      <span class="spacer"></span>
      <span id="link-pill" class="pill">Sem conexão</span>
    </header>
    <div id="stage">
      <canvas id="view" aria-label="Sala isométrica"></canvas>
      <div id="bubbles"></div>
      <div id="windows"></div>
      <div id="banner" class="banner" hidden>
        <p id="banner-text"></p>
        <button class="tiny" id="banner-close" type="button">Entendi</button>
      </div>
      <div id="toasts" aria-live="polite"></div>
    </div>
    <div id="context" hidden>
      <span id="context-label"></span>
      <button type="button" id="ctx-rotate">Girar</button>
      <button type="button" id="ctx-pickup">Pegar</button>
      <button type="button" id="ctx-cancel">Cancelar</button>
    </div>
    <form id="chat" autocomplete="off">
      <label class="sr-only" for="chat-input">Dizer algo</label>
      <input id="chat-input" maxlength="180" placeholder="Dizer algo…" enterkeyhint="send" />
      <button type="submit">Falar</button>
    </form>
    <nav id="toolbar" aria-label="Ações">
      <button class="tool" type="button" id="tool-building"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 20 V9 L12 4 L20 9 V20 H14 V14 H10 V20 Z"/></svg><span>Prédio</span></button>
      <button class="tool" type="button" data-open="rooms"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 10 L12 4 L20 10 V20 H14 V14 H10 V20 H4 Z"/></svg><span>Salas</span></button>
      <button class="tool" type="button" data-open="catalog"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 4 H15 V20 L10 17 L5 20 Z"/></svg><span>Catálogo</span></button>
      <button class="tool" type="button" data-open="bag"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 8 V7 a5 5 0 0 1 10 0 V8 H20 V21 H4 V8 Z M9 8 h6 V7 a3 3 0 0 0-6 0 Z"/></svg><span>Mochila</span><em id="bag-count" hidden>0</em></button>
      <button class="tool" type="button" id="tool-move" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 L15 8 H9 Z M12 22 L9 16 H15 Z M2 12 L8 9 V15 Z M22 12 L16 15 V9 Z"/></svg><span>Mover</span></button>
      <button class="tool" type="button" id="tool-wave"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 14 c0-4 2-8 6-8 c1 3-1 5-1 8 H8 Z M14 6 c2-2 5-1 6 1 c-2 1-3 2-4 4"/></svg><span>Acenar</span></button>
      <button class="tool" type="button" id="tool-sit"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 10 H18 V13 H16 V20 H14 V13 H10 V20 H8 V13 H6 Z M9 4 H15 V8 H9 Z"/></svg><span>Sentar</span></button>
      <button class="tool" type="button" id="tool-dance"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 3 h4 v5 h3 l-5 4 l-5-4 h3 Z M8 14 h8 v2 H8 Z M7 18 h4 v3 H7 Z M13 18 h4 v3 h-4 Z"/></svg><span>Dançar</span></button>
      <button class="tool" type="button" data-open="look"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3" fill="currentColor"/><path fill="currentColor" d="M6 19 c1-4 3-5 6-5 s5 1 6 5 Z"/></svg><span>Visual</span></button>
      <button class="tool" type="button" data-open="talk"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 5 H20 V16 H9 L4 20 Z"/></svg><span>Conversa</span></button>
      <button class="tool" type="button" id="tool-kit"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 7 H20 V19 H4 Z M8 7 V5 H16 V7"/></svg><span>Ferramentas</span></button>
      <button class="tool" type="button" id="tool-settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="currentColor"/><path fill="currentColor" d="M12 2 L13.5 6 H10.5 Z M12 22 L10.5 18 H13.5 Z M2 12 L6 10.5 V13.5 Z M22 12 L18 13.5 V10.5 Z"/></svg><span>Ajustes</span></button>
      <button class="tool" type="button" data-open="help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path fill="currentColor" d="M11 17 h2 v2 h-2 Z M11 7 h2 c2 0 3 1 3 3 c0 2-2 2-2 4 h-2 c0-3 2-3 2-4 c0-1-1-1-1-1 h-2 Z"/></svg><span>Ajuda</span></button>
      <button class="tool" type="button" id="tool-lock"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 10 V8 a4 4 0 0 1 8 0 v2 h1 v10 H7 V10 Z m2 0 h4 V8 a2 2 0 0 0-4 0 Z"/></svg><span>Travar</span></button>
    </nav>
  </div>
  <noscript><p>O Escritório precisa de JavaScript.</p></noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
